[workspace]
members = ["crates/carranta-analytics", "crates/carranta-evolve", "crates/carranta-bot", "crates/carranta-core", "crates/carranta-record", "crates/carranta-ui"]
resolver = "3"

[workspace.package]
edition = "2024"
# `u64::is_multiple_of`, used throughout, landed in 1.87; edition 2024 alone
# would only need 1.85, so this is the binding constraint.
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmarks and profiling runs use this: release codegen, but with debug
# symbols so perf/samply can attribute time to source lines.
[profile.bench]
inherits = "release"
debug = true
