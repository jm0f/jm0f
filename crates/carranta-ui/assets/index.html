      x.className = 'btn-ghost btn-sm';
      x.textContent = 'close';
      x.style.cssText = 'position:absolute; top:10px; right:12px;';
      x.onclick = closePrompt;
      host.appendChild(x);
    }
  };
  const buttonList = (choices) => {
    const box = document.createElement('div');
    box.className = 'buttons';
    choices.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c.label;
      b.onclick = () => { prompt.mode = null; act(c.i); };
      box.appendChild(b);
    });
    host.appendChild(box);
  };

  if (mode === 'discard') {
    head('A seven was rolled, hand half of it back', false);
    buttonList(discard);
    return;
  }
  if (mode === 'pick') { head(prompt.data.title, true); buttonList(prompt.data.choices); return; }
  if (mode === 'offers') { head('On the table', false); renderOffers(v, host, v.offers, decline); return; }
  if (mode === 'compose') { renderCompose(v, host); return; }
}

function renderOffers(v, host, offers, decline) {
  const names = n => v.resourceNames.filter(r => n[r.i]).map(r => `${n[r.i]} ${r.name}`).join(', ') || ', ';
  offers.forEach(o => {
    const d = document.createElement('div');
    d.className = 'offer';
    // The same loader the empty seats use, in the proposer's colour. An offer
    // is a question somebody is waiting on the answer to, and the motion is
    // what walks the eye from who asked to the buttons that answer them.
    d.appendChild(pixelLoader(COLOURS[o.from]));
    const who = document.createElement('span');
    who.className = 'who';
    const addressed = o.to === null ? '' : (o.to === v.you ? ' → you' : ` → ${seatName(v, o.to)}`);
    who.textContent = `${o.mine ? 'you' : seatName(v, o.from)}: ${names(o.give)} for ${names(o.want)}`;
    if (addressed) {
      const tag = document.createElement('span');
      tag.className = 'addressed';
      tag.textContent = addressed;
      who.appendChild(tag);
    }
    d.appendChild(who);
    // Taking or pulling an offer is an ordinary choice, so the button is
    // whichever one the engine is offering for it.
    const c = v.choices.find(x => x.label === `Accept offer ${o.i}` || x.label === `Withdraw offer ${o.i}`);
    if (c) {
      const b = document.createElement('button');
      b.className = o.mine ? 'btn-secondary btn-sm' : 'btn-primary btn-sm';
      b.textContent = o.mine ? 'withdraw' : 'accept';
      b.onclick = () => act(c.i);
      d.appendChild(b);
    }
    if (!o.mine && v.canPropose) {
      const b = document.createElement('button');
      b.className = 'btn-secondary btn-sm';
      b.textContent = 'counter';
      b.onclick = () => counter(o);
      d.appendChild(b);
    }
    // No accept button and nothing in hand to cover it: say which, rather than
    // leaving a row with no explanation for why it cannot be taken.
    if (!o.mine && !c && v.resourceNames.some(r => v.yourHand[r.i] < o.want[r.i])) {
      const s = document.createElement('span');
      s.className = 'tag tag-outline';
      s.textContent = 'you cannot cover this';
      d.appendChild(s);
    }
    host.appendChild(d);
  });

  // Turning offers down was reachable in the engine and nowhere on the screen,
  // which left the card with no way out except accepting something. Declining
  // clears every open offer at once, so it is one button for the card and its
  // wording says how far it reaches.
  if (decline) {
    const theirs = offers.filter(o => !o.mine).length;
    host.appendChild(el2('hr', { class: 'separator' }));
    const b = document.createElement('button');
    b.className = 'btn-secondary btn-block';
    b.textContent = theirs > 1 ? `No thanks, turn down all ${theirs}` : 'No thanks';
    b.onclick = () => act(decline.i);
    host.appendChild(b);
  }
}

// The board is drawn with SVG elements; the panels are ordinary HTML, and a
// separator built in the SVG namespace renders as nothing at all.
function el2(tag, attrs) {
  const n = document.createElement(tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// Answer an offer with one of your own: their side becomes yours, mirrored,
// as a starting point to edit. R-7.3 makes the counterparty the only seat this
// can go to, so it is addressed to them.
function counter(o) {
  give = o.want.slice();
  want = o.give.slice();
  to = String(o.from);
  openPrompt('compose');
}

function renderCompose(v, host) {
  const h = document.createElement('h2');
  h.id = 'promptTitle';
  h.textContent = v.yourTurn ? 'Offer a trade, click your cards to add them'
    : `Counter ${seatName(v, v.toAct)}`;
  host.appendChild(h);
  const x = document.createElement('button');
  x.className = 'btn-ghost btn-sm';
  x.textContent = 'close';
  x.style.cssText = 'position:absolute; top:10px; right:12px;';
  x.onclick = closePrompt;
  host.appendChild(x);

  // Who it can go to. On another seat's turn R-7.3 leaves only them, so the
  // choice is made rather than offered.
  const others = v.seats.map(s => s.seat).filter(s => s !== v.you);
  const allowed = v.yourTurn ? others : [v.toAct];
  if (!v.yourTurn) to = String(v.toAct);
  const toRow = document.createElement('div');
  toRow.className = 'toRow';
  toRow.innerHTML = '<span class="sideLabel">to</span>';
  const sel = document.createElement('select');
  if (v.yourTurn) sel.appendChild(new Option('anyone at the table', ''));
  allowed.forEach(p => sel.appendChild(new Option(seatName(v, p), String(p))));
  sel.value = to;
  sel.onchange = () => { to = sel.value; };
  toRow.appendChild(sel);
  host.appendChild(toRow);

  const compose = document.createElement('div');
  compose.className = 'compose';
  [['you give', give], ['you want', want]].forEach(([label, counts]) => {
    const side = document.createElement('div');
    side.innerHTML = `<span class="sideLabel">${label}</span>`;
    v.resourceNames.forEach(r => {
      // A resource may not sit on both sides of one trade (R-7.18), so
      // claiming it for one side closes it on the other.
      const giving = counts === give;
      const blocked = giving ? want[r.i] > 0 : give[r.i] > 0;
      const row = document.createElement('div');
      row.className = 'row ' + (counts[r.i] ? 'on' : 'off');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      const have = document.createElement('span');
      have.className = 'have';
      have.textContent = giving ? v.yourHand[r.i] : '';
      const minus = document.createElement('button');
      minus.className = 'btn-sm btn-icon';
      minus.textContent = '−';
      minus.disabled = counts[r.i] === 0;
      minus.onclick = () => { counts[r.i]--; renderPrompt(view); renderHand(view); };
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = counts[r.i];
      const plus = document.createElement('button');
      plus.className = 'btn-sm btn-icon';
      plus.textContent = '+';
      // You can only offer what you hold; what you ask for is bounded by the
      // supply, and refused at acceptance if nobody can pay.
      plus.disabled = blocked || (giving && counts[r.i] >= v.yourHand[r.i]);
      plus.onclick = () => { counts[r.i]++; renderPrompt(view); renderHand(view); };
      row.append(name, have, minus, n, plus);
      side.appendChild(row);
    });
    compose.appendChild(side);
  });
  host.appendChild(compose);

  const sum = a => a.reduce((p, q) => p + q, 0);
  const go = document.createElement('button');
  go.id = 'propose';
  go.className = 'btn-primary btn-block';
  go.textContent = 'Put it on the table';
  go.style.cssText = 'margin-top:10px';
  go.disabled = !sum(give) || !sum(want);
  go.onclick = () => {
    prompt.mode = null;
    load('/api/propose', {
      method: 'POST',
      body: to === ''
        ? JSON.stringify({ give, want, version: view.version })
        : JSON.stringify({ give, want, to: Number(to), version: view.version }),
    });
  };
  host.appendChild(go);
}

async function load(url, opts) {
  const r = await fetch(url, opts);
  const next = await r.json();
  // A composed offer is about a position; when that moves, start it over
  // rather than carrying a half-built offer into a hand that has changed.
  if (!view || next.version !== view.version) {
    give = [0, 0, 0, 0, 0]; want = [0, 0, 0, 0, 0]; to = '';
  }
  view = next;
  render();
}
function act(i) {
  load('/api/act', {
    method: 'POST',
    body: JSON.stringify({ action: i, version: view.version }),
  });
}
document.getElementById('labels').onchange = () => { if (view) { draw(); } };
// New game goes through the lobby rather than restarting on the spot: the
// settings are the point of pressing it.
document.getElementById('new').onclick = openLobby;
// A game nobody has touched yet gets the lobby; one already in progress does
// not, so reloading the page mid-game returns you to the board rather than
// making you deal a new one.
loadArt()
  .then(() => load('/api/state'))
  .then(() => { if (view.version === 0) openLobby(); });

// The server is restarted whenever a change is pulled, and a page served by
// the old one cannot re-render its way up to date. Watch the build stamp and
// start over when it moves, so a pushed change reaches the board without
// anyone reloading anything.
setInterval(async () => {
  try {
    const next = await (await fetch('/api/state', { cache: 'no-store' })).json();
    if (view && next.build !== view.build) { location.reload(); return; }
    // The same poll enforces the clock: the server only wakes when asked, so
    // without this a turn that ran out of time would sit there until clicked.
    if (view && next.version !== view.version) { view = next; render(); }
  } catch (e) {
    // The server is mid-restart. Nothing to do but ask again shortly.
  }
}, 3000);
</script>
</body>
</html>
