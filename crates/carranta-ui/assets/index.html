<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carranta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9 29,23 16,30 3,23 3,9' fill='%237ba85c'/%3E%3C/svg%3E">
<style>
  :root {
    /* Light ground. Everything below is re-picked for it rather than tinted
       from the dark palette: a colour that reads as vivid against near-black
       goes garish against white, and the two sets share almost nothing. */
    --bg: #ffffff; --panel: #ffffff; --line: #e3e8ee;
    --ink: #0a2540; --dim: #5c6f8a;
    --accent: #635bff; --accent2: #0aa4f5;
    /* Flat, unbroken colour. The scheme's confidence comes from committing
       to one value per terrain — a gradient softens exactly the crispness
       that makes it work. */
    --hills: #FA4616; --forest: #0F5C39; --pasture: #A3E635;
    --fields: #FFC300; --mountains: #474D66; --desert: #FFA333;
    --water: #4A9BF7;
    /* Player colours darkened for contrast against light terrain — the dark
       theme's pastels vanished on the pasture and fields. */
    --p0: #1d6fe0; --p1: #e0244f; --p2: #6b7c93; --p3: #e8720c;
  }
  * { box-sizing: border-box; }
  /* The board should use the window it is given, so the page is a column that
     fills the viewport exactly: header at its natural height, everything else
     sharing what is left. Nothing scrolls the page itself. */
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
    /* Two wide, faint pools of colour rather than a flat field, so the dark
       reads as depth instead of as absence. */
    background:
      radial-gradient(1200px 620px at 85% -18%, rgba(99, 91, 255, .20), transparent 62%),
      radial-gradient(900px 520px at 96% 6%, rgba(255, 94, 140, .16), transparent 58%),
      radial-gradient(700px 520px at 62% -12%, rgba(10, 164, 245, .16), transparent 60%),
      var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.72);
    backdrop-filter: saturate(150%) blur(10px);
    flex: none;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .status { color: var(--dim); }
  header .toggle { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .vid { font: 600 8px ui-sans-serif, system-ui, sans-serif; text-anchor: middle;
         dominant-baseline: central; pointer-events: none; fill: #0a2540; }
  .vid.coast { fill: #0b6bb8; }
  header .build { color: var(--dim); opacity: .6; font-size: 12px; font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  button, select {
    font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(10, 37, 64, .06);
  }
  button:hover:not(:disabled) { background: #f6f9fc; border-color: #cfd8e3; }
  #new, #propose {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff; font-weight: 600;
    box-shadow: 0 2px 6px rgba(99, 91, 255, .35);
  }
  #new:hover, #propose:hover:not(:disabled) { filter: brightness(1.08); }
  .choices button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  main {
    display: grid; gap: 16px; padding: 16px;
    /* A board is about as tall as it is wide, so on a wide screen its height
       is what limits it and the extra width would otherwise sit empty beside
       it. Spend that on the side panels instead, up to a point past which
       lines of text get uncomfortable to read. */
    grid-template-columns: minmax(0, 1fr) clamp(320px, 24vw, 440px);
    flex: 1; min-height: 0;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    box-shadow: 0 2px 5px rgba(10, 37, 64, .04), 0 12px 28px rgba(10, 37, 64, .06);
  }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  /* `min-height: 0` on both is what lets the board shrink: a grid or flex item
     defaults to refusing to go below its content, which is exactly how a board
     ends up taller than the window. */
  .boardPanel { display: flex; min-width: 0; min-height: 0; }
  #board { flex: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
  .sidebar {
    display: flex; flex-direction: column; gap: 16px;
    min-width: 0; min-height: 0; overflow-y: auto;
  }
  /* Narrow enough that side-by-side stops making sense: stack, and let the
     page scroll again rather than squeezing the board into a sliver. */
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .sidebar { overflow: visible; }
    #board { height: auto; max-height: 70vh; }
  }
  .hexnum { font: 600 13px ui-sans-serif, system-ui, sans-serif; text-anchor: middle;
            dominant-baseline: central; pointer-events: none; }
  .pip { fill: #1b1d22; }
  .red { fill: #d13b3b; }
  .spot { cursor: pointer; }
  /* A ghost drifts; a placed piece does not. The movement is what separates
     "could go here" from "is here" without another colour or outline. Small
     enough not to pull the eye off the board — it should read at the edge of
     vision, not demand attention. */
  @keyframes hover { 50% { transform: translateY(-3px); } }
  .ghost { animation: hover 2.2s ease-in-out infinite; }
  .ghost:hover { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .ghost { animation: none; } }
  .spot:hover circle, .spot:hover line { filter: brightness(1.5); }
  .choices { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
  .choices button { text-align: left; }
  .group { color: var(--dim); font-size: 11px; text-transform: uppercase;
           letter-spacing: .08em; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 3px 4px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .cards { display: flex; gap: 6px; flex-wrap: wrap; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; background: #f6f9fc; }
  .card b { font-variant-numeric: tabular-nums; }
  #log { max-height: 200px; overflow-y: auto; color: var(--dim); font-size: 12px; }
  #log div { padding: 1px 0; }
  #note { color: #c2410c; }
  .toRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toRow select { flex: 1; }
  .compose { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sideLabel { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
  .row .name { flex: 1; font-size: 12px; }
  .row .have { color: var(--dim); font-size: 11px; min-width: 14px; text-align: right; }
  .row button { padding: 0 7px; line-height: 1.5; }
  .row .n { min-width: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  .row.on .name { color: var(--ink); font-weight: 600; }
  .row.off .name { color: var(--dim); }
  .offer { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .offer .who { flex: 1; }
  .offer .addressed { color: #b45309; }
  .you { outline: 1px solid var(--p0); }
</style>
</head>
<body>
<header>
  <h1>Carranta</h1>
  <span class="status" id="status">loading…</span>
  <span class="build" id="build"></span>
  <span class="spacer"></span>
  <select id="seats"><option value="3">3 seats</option><option value="4" selected>4 seats</option></select>
  <select id="mode">
    <option value="full" selected>open market</option>
    <option value="restricted">1-for-1 trades</option>
    <option value="disabled">no trading</option>
  </select>
  <label class="toggle"><input type="checkbox" id="labels"> ids</label>
  <button id="new">New game</button>
</header>

<main>
  <div class="panel boardPanel">
    <svg id="board" viewBox="-360 -330 720 660" preserveAspectRatio="xMidYMid meet"
         aria-label="game board"></svg>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2>Your move <span id="note"></span></h2>
      <div class="choices" id="choices"></div>
    </div>
    <div class="panel">
      <h2>Your cards</h2>
      <div class="cards" id="hand"></div>
      <div class="cards" id="dev" style="margin-top:8px"></div>
    </div>
    <div class="panel">
      <h2>Seats</h2>
      <table id="seatTable"></table>
    </div>
    <div class="panel">
      <h2>Offers</h2>
      <div id="offers"></div>
    </div>
    <div class="panel" id="proposePanel">
      <h2>Offer a trade</h2>
      <div class="toRow">
        <span class="sideLabel">to</span>
        <select id="to"></select>
      </div>
      <div class="compose">
        <div class="side"><span class="sideLabel">you give</span><div id="give"></div></div>
        <div class="side"><span class="sideLabel">you want</span><div id="want"></div></div>
      </div>
      <button id="propose" style="margin-top:8px; width:100%">Put it on the table</button>
    </div>
    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </div>
</main>

<script>
const COLOURS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SIZE = 62;                 // hex radius in svg units
let view = null;

// Pointy-top axial to pixel. A vertex arrives as the *sum* of the three
// lattice positions meeting there, so dividing by three lands on its centroid.
function px(q, r) {
  return [SIZE * Math.sqrt(3) * (q + r / 2), SIZE * 1.5 * r];
}
function vertexXY(v) { const [x, y] = px(v.q3 / 3, v.r3 / 3); return [x, y]; }

function hexPoints(cx, cy) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push(`${(cx + SIZE * Math.cos(a)).toFixed(1)},${(cy + SIZE * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}

function el(tag, attrs, kids) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (kids || []).forEach(c => n.appendChild(c));
  return n;
}

// One photograph per hex, clipped to the hexagon.
//
// A repeating pattern was the wrong tool: it showed an arbitrary crop of the
// picture, and pulling back only brought the repeat closer until the tile
// would have seamed inside a single hex. A clipped image has no repeat to
// avoid, so the photograph is laid over the hexagon's own box and scaled to
// cover it — the composition survives, and the hexagon does the cropping.
function photoHex(svg, id, terrain, cx, cy) {
  const w = SIZE * Math.sqrt(3), h = SIZE * 2;   // the hexagon's exact box
  const defs = el('defs', {});
  const clip = el('clipPath', { id });
  clip.appendChild(el('polygon', { points: hexPoints(cx, cy) }));
  defs.appendChild(clip);
  svg.appendChild(defs);
  svg.appendChild(el('image', {
    href: `/art/${terrain}.jpg`,
    x: cx - w / 2, y: cy - h / 2, width: w, height: h,
    preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#${id})`,
  }));
}

// How many ways there are to roll each number: the dots under a disc.
function pips(n) { return n === 0 ? 0 : 6 - Math.abs(7 - n); }

// Rebuild whole ports from the per-intersection list. A port covers two
// adjacent coastal intersections, so its two entries are joined by an edge;
// anything left unpaired is drawn on its own rather than dropped.
function portGroups() {
  const byKind = {};
  view.ports.forEach(code => {
    const kind = code % 8;
    (byKind[kind] = byKind[kind] || []).push(Math.floor(code / 8));
  });
  const joined = new Set();
  view.edges.forEach(e => { joined.add(e.a + ':' + e.b); joined.add(e.b + ':' + e.a); });

  const out = [];
  for (const kind in byKind) {
    const left = byKind[kind].slice();
    while (left.length) {
      const v = left.shift();
      const i = left.findIndex(w => joined.has(v + ':' + w));
      out.push({ kind: +kind, at: i < 0 ? [v] : [v, left.splice(i, 1)[0]] });
    }
  }
  return out;
}

// Player colours as values rather than CSS variables, because a piece is
// drawn in several tones of one colour and they have to be computed.
const SEAT_HEX = ['#1d6fe0', '#e0244f', '#6b7c93', '#e8720c'];
const HUMAN_SEAT = 0;   // ghosts are always shown in your own colour

// The palette the drawings are in, and how light each tone is relative to the
// piece's base colour. Recolouring by lookup rather than by measuring the
// pixel keeps the artist's intent: these five values are the lighting, and a
// blue road should be lit exactly as the pink one was.
// The bar inside every road drawing is this long, in the drawing's own units.
// All three orientations are the same prism, so one number serves them all.
const ROAD_LENGTH = 79;

const ART_TONES = {
  '#FFACD5': 0.26,   // top faces, catching the light
  '#FF87C2': 0.13,
  '#FF71B7': 0.00,   // the base tone everything is relative to
  '#FC65B0': -0.10,
  '#FE5BAC': -0.20,  // faces turned away
};

function tone(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const mix = (c) => Math.round(amount > 0 ? c + (255 - c) * amount : c * (1 + amount));
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
  return `rgb(${r},${g},${b})`;
}

// The drawings, fetched once and kept as parsed nodes to clone per piece.
const art = {};
async function loadArt() {
  for (const name of ['road-30', 'road-90', 'road-150', 'settlement', 'city']) {
    const text = await (await fetch(`/art/${name}.svg`)).text();
    art[name] = new DOMParser().parseFromString(text, 'image/svg+xml').documentElement;
  }
}

// Place a drawing on the board: centred on (x, y), scaled to `height` board
// units tall, in the seat's colour. `anchor` shifts it down by a fraction of
// its height, so a building stands on its intersection rather than floating
// with the point in the middle of it.
function place(svg, name, x, y, k, seat, anchor = 0.5) {
  const src = art[name];
  if (!src) return;
  const w = parseFloat(src.getAttribute('width'));
  const h = parseFloat(src.getAttribute('height'));

  const node = src.cloneNode(true);
  node.querySelectorAll('[fill]').forEach((n) => {
    const f = (n.getAttribute('fill') || '').toUpperCase();
    if (f in ART_TONES) n.setAttribute('fill', tone(SEAT_HEX[seat], ART_TONES[f]));
  });
  node.setAttribute('width', w * k);
  node.setAttribute('height', h * k);
  node.setAttribute('x', x - (w * k) / 2);
  node.setAttribute('y', y - h * k * anchor);
  node.removeAttribute('style');
  svg.appendChild(node);
  return node;
}

function draw() {
  const svg = document.getElementById('board');
  svg.textContent = '';
  const vxy = {};
  view.vertices.forEach(v => { vxy[v.id] = vertexXY(v); });

  // Which board features are clickable this move.
  const byVertex = {}, byEdge = {}, byHex = {};
  view.choices.forEach(c => {
    if (c.vertex !== undefined) (byVertex[c.vertex] = byVertex[c.vertex] || []).push(c);
    if (c.edge !== undefined) (byEdge[c.edge] = byEdge[c.edge] || []).push(c);
    if (c.hex !== undefined) (byHex[c.hex] = byHex[c.hex] || []).push(c);
  });

  view.hexes.forEach(h => {
    const [cx, cy] = px(h.q, h.r);
    const g = el('g', byHex[h.id] ? { class: 'spot' } : {});
    // The photograph goes down first; the polygon above it carries the gap
    // stroke and nothing else.
    photoHex(svg, `t-${h.id}`, h.terrain, cx, cy);
    g.appendChild(el('polygon', {
      points: hexPoints(cx, cy), fill: 'none',
      // The outline is drawn in the panel's own colour, so it reads as a gap
      // between tiles rather than a line around them — the board separates
      // into pieces without anything being added to it. Taken from the
      // stylesheet rather than written here, so it follows the theme.
      stroke: byHex[h.id] ? 'var(--accent)' : 'var(--panel)',
      'stroke-width': byHex[h.id] ? 4 : 3,
    }));
    if (h.number > 0) {
      // A white disc, borderless: the number needs its own ground to sit on,
      // and with no outline the disc is a shape rather than a badge. One ink
      // again, since the disc supplies the contrast whatever is under it.
      g.appendChild(el('circle', { cx, cy, r: 17, fill: '#ffffff' }));
      const hot = h.number === 6 || h.number === 8;
      const ink = hot ? '#c02626' : '#1b1d22';
      const t = el('text', { x: cx, y: cy - 3, class: 'hexnum', fill: ink });
      t.textContent = h.number;
      g.appendChild(t);
      const n = pips(h.number);
      for (let i = 0; i < n; i++) {
        g.appendChild(el('circle', {
          cx: cx + (i - (n - 1) / 2) * 4.5, cy: cy + 9, r: 1.6,
          class: hot ? 'red' : 'pip',
        }));
      }
    }
    if (h.robber) {
      g.appendChild(el('circle', { cx, cy: cy + 26, r: 9, fill: '#111', stroke: '#fff', 'stroke-width': 1.5 }));
    }
    if (byHex[h.id]) g.onclick = () => act(byHex[h.id][0].i);
    svg.appendChild(g);
  });

  // Ports sit just off the coast, each joined to the two intersections it
  // serves. They arrive per-intersection, so put each port back together
  // first — drawing them apart would show eighteen ports where there are nine.
  portGroups().forEach(port => {
    const pts = port.at.map(v => vxy[v]);
    const mx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const my = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const k = Math.hypot(mx, my) || 1;
    const ox = mx + (mx / k) * 30, oy = my + (my / k) * 30;
    pts.forEach(([x, y]) => svg.appendChild(el('line', {
      x1: ox, y1: oy, x2: x, y2: y, stroke: '#b3c0d1', 'stroke-width': 2.5, opacity: .8,
    })));
    svg.appendChild(el('circle', { cx: ox, cy: oy, r: 12, fill: '#ffffff', stroke: '#c2cddb' }));
    const t = el('text', { x: ox, y: oy, class: 'hexnum', fill: '#5c6f8a', 'font-size': 9 });
    // Two letters, taken from the same names the cards use, so a port and a
    // card cannot be read as different resources.
    t.textContent = port.kind === 0 ? '3:1' : ['Br', 'Wd', 'Wl', 'Wh', 'Or'][port.kind - 1];
    svg.appendChild(t);
  });

  // Pieces are solid: a top face lying in the board's plane, with a skirt
  // dropped from every edge that faces the viewer. Collected rather than drawn
  // as we go, because a piece lower on the board has to be painted after the
  // ones behind it or it will be occluded by them.
  const solids = [];
  view.roads.forEach(([seat, e]) => {
    const edge = view.edges[e];
    const [x1, y1] = vxy[edge.a], [x2, y2] = vxy[edge.b];
    // Which drawing to use is decided by the edge's angle. A piece drawn in
    // perspective cannot be rotated to face another way — it would lean the
    // wrong direction — so each orientation needs its own drawing rather than
    // a transform.
    const deg = ((Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI) % 180 + 180) % 180;
    // A pointy-top board has three edge angles and there is a drawing for each.
    const name = deg < 60 ? 'road-30' : (deg < 120 ? 'road-90' : 'road-150');
    // Scaled by the bar's own length rather than the drawing's box, which for
    // a diagonal piece is far bigger than the bar inside it — the mistake that
    // made the roads overshoot their edges.
    const k = Math.hypot(x2 - x1, y2 - y1) * 0.70 / ROAD_LENGTH;
    // Lifted so the piece's underside sits on the edge rather than its middle.
    // Centring the drawing puts half the thickness below the line, which reads
    // as the road having slid off it.
    // The vertical drawing carries its front face below the bar, so it needs
    // a different balance point from the diagonals to sit on the same line.
    const anchor = name === 'road-90' ? 0.54 : 0.62;
    solids.push({ art: name, seat, x: (x1 + x2) / 2, y: (y1 + y2) / 2, k, anchor });
  });

  view.buildings.forEach(([seat, v, city]) => {
    const [x, y] = vxy[v];
    solids.push({
      art: city ? 'city' : 'settlement', seat, x, y,
      // A city stays larger than a settlement, but only just: the drawing
      // already says "more building" through its shape, and leaning on size
      // as well made the two read as different scales rather than an upgrade.
      k: (city ? 31 : 23) / (city ? 72 : 60),
      // Buildings stand on their intersection: most of the drawing rises
      // above it rather than straddling it.
      anchor: 0.72,
    });
  });

  // Painter's order: whatever sits lowest on the board goes on last, or a
  // piece in front is covered by the one behind it.
  solids.sort((a, b) => a.y - b.y);
  solids.forEach((s) => place(svg, s.art, s.x, s.y, s.k, s.seat, s.anchor));

  // Where you may build, shown as a ghost of the piece you would get rather
  // than an abstract marker: the same drawing, in your colour, at a fraction
  // of its opacity. It answers "what goes here" without a legend, and a city
  // upgrade looks different from a new settlement, which a dot never did.
  const ghost = (name, x, y, k, anchor, choice) => {
    const node = place(svg, name, x, y, k, HUMAN_SEAT, anchor);
    if (!node) return;
    node.setAttribute('opacity', 0.45);
    const g = el('g', { class: 'spot ghost' });
    svg.removeChild(node);
    g.appendChild(node);
    g.onclick = () => act(choice);
    svg.appendChild(g);
  };

  for (const e in byEdge) {
    const edge = view.edges[e];
    const [x1, y1] = vxy[edge.a], [x2, y2] = vxy[edge.b];
    const deg = ((Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI) % 180 + 180) % 180;
    const name = deg < 60 ? 'road-30' : (deg < 120 ? 'road-90' : 'road-150');
    ghost(name, (x1 + x2) / 2, (y1 + y2) / 2,
          Math.hypot(x2 - x1, y2 - y1) * 0.70 / ROAD_LENGTH,
          name === 'road-90' ? 0.54 : 0.62, byEdge[e][0].i);
  }
  for (const v in byVertex) {
    const [x, y] = vxy[v];
    // An upgrade and a new settlement are offered at the same kind of place,
    // so the label is what says which piece is on offer here.
    const city = /city/i.test(byVertex[v][0].label || '');
    ghost(city ? 'city' : 'settlement', x, y,
          (city ? 31 : 23) / (city ? 72 : 60), 0.72, byVertex[v][0].i);
  }

  // Intersection numbers, for talking about specific places on the board —
  // "the port between 8 and 16" rather than "the one at the top left". The
  // coastal ones are picked out, since those are the only ones a port can sit
  // on. Drawn last so nothing covers them.
  if (document.getElementById('labels').checked) {
    const coastal = new Set();
    view.ports.forEach(code => coastal.add(Math.floor(code / 8)));
    view.vertices.forEach(v => {
      const [x, y] = vxy[v.id];
      const onCoast = (view.coast || []).includes(v.id);
      svg.appendChild(el('circle', {
        cx: x, cy: y, r: 8.5, fill: onCoast ? '#0b2b3d' : '#e8eaee', opacity: .95,
      }));
      const t = el('text', { x, y, class: onCoast ? 'vid coast' : 'vid' });
      t.textContent = v.id;
      svg.appendChild(t);
    });
  }

  fit(svg);
}

// Frame what was actually drawn, rather than a rectangle guessed in advance.
//
// The board's extent is not a constant: three seats deal a different spread
// than four, and port labels hang outside the coast. Measuring it means the
// board is never clipped and never floats inside slack it does not need —
// `preserveAspectRatio` then scales that box to whatever room the layout has.
function fit(svg) {
  let box;
  try { box = svg.getBBox(); } catch (e) { return; }   // not laid out yet
  if (!box || box.width === 0 || box.height === 0) return;
  const pad = 14;                                       // room for strokes
  svg.setAttribute(
    'viewBox',
    `${box.x - pad} ${box.y - pad} ${box.width + 2 * pad} ${box.height + 2 * pad}`,
  );
}

function render() {
  const v = view;
  const turn = v.winner !== null
    ? (v.winner === v.you ? 'You won' : `Seat ${v.winner} won`)
    : (v.yourTurn ? `Your move — ${v.phase}` : `Seat ${v.toAct} is playing`);
  const dice = v.dice[0] ? ` · last roll ${v.dice[0]}+${v.dice[1]}=${v.dice[0] + v.dice[1]}` : '';
  document.getElementById('status').textContent = `${turn}${dice} · seed ${v.seed}`;
  document.getElementById('build').textContent = `build ${v.build}`;
  document.getElementById('note').textContent = v.note || '';

  draw();

  // The engine enumerates every single-type offer it could generate — up to
  // ~180 of them. That is the right action space for a search and the wrong
  // one for a person, so they are folded away and the composer replaces them:
  // it can express those and the mixed offers generation never enumerates.
  // Two kinds of choice are shown elsewhere: the enumerated proposals, which
  // the composer replaces, and accepting or withdrawing, which belong beside
  // the offer itself where its contents are visible — "Accept offer 0" says
  // considerably less than the offer does.
  const shown = v.choices.filter(c =>
    !/^(Offer |Accept offer |Withdraw offer )/.test(c.label));

  const box = document.getElementById('choices');
  box.textContent = '';
  if (!shown.length) {
    const d = document.createElement('div');
    d.className = 'group';
    d.textContent = v.winner !== null ? 'the game is over' : 'waiting for the other seats';
    box.appendChild(d);
  }
  let group = null;
  shown.forEach(c => {
    if (c.group !== group) {
      group = c.group;
      const h = document.createElement('div');
      h.className = 'group';
      h.textContent = group;
      box.appendChild(h);
    }
    const b = document.createElement('button');
    b.textContent = c.label;
    b.onclick = () => act(c.i);
    box.appendChild(b);
  });

  const hand = document.getElementById('hand');
  hand.textContent = '';
  v.resourceNames.forEach(r => {
    const d = document.createElement('span');
    d.className = 'card';
    d.innerHTML = `${r.name} <b>${v.yourHand[r.i]}</b>`;
    hand.appendChild(d);
  });
  const dev = document.getElementById('dev');
  dev.textContent = '';
  v.devNames.forEach(c => {
    if (!v.yourDev[c.i]) return;
    const d = document.createElement('span');
    d.className = 'card';
    const fresh = v.yourFresh[c.i] ? ' (new)' : '';
    d.innerHTML = `${c.name}${fresh} <b>${v.yourDev[c.i]}</b>`;
    dev.appendChild(d);
  });

  const t = document.getElementById('seatTable');
  t.innerHTML = '<tr><th>seat</th><th>vp</th><th>cards</th><th>dev</th><th>road</th><th>militia</th></tr>';
  v.seats.forEach(s => {
    const row = document.createElement('tr');
    if (s.seat === v.you) row.className = 'you';
    const tags = (s.longestRoad ? ' ▸road' : '') + (s.largestMilitia ? ' ▸militia' : '');
    const vp = s.seat === v.you ? `${v.yourVp}` : `${s.vp}`;
    row.innerHTML = `<td><span class="swatch" style="background:${COLOURS[s.seat]}"></span>`
      + `${s.seat === v.you ? 'you' : 'seat ' + s.seat}${tags}</td>`
      + `<td>${vp}</td><td>${s.hand}</td><td>${s.dev}</td><td>${s.road}</td><td>${s.militia}</td>`;
    t.appendChild(row);
  });

  const offers = document.getElementById('offers');
  offers.textContent = '';
  if (!v.offers.length) offers.innerHTML = '<div class="group">none on the table</div>';
  v.offers.forEach(o => {
    const names = n => v.resourceNames.filter(r => n[r.i]).map(r => `${n[r.i]} ${r.name}`).join(', ') || '—';
    const d = document.createElement('div');
    d.className = 'offer';
    const who = document.createElement('span');
    who.className = 'who';
    const addressed = o.to === null ? '' : (o.to === v.you ? ' → you' : ` → seat ${o.to}`);
    who.textContent = `${o.mine ? 'you' : 'seat ' + o.from}: ${names(o.give)} for ${names(o.want)}`;
    if (addressed) {
      const tag = document.createElement('span');
      tag.className = 'addressed';
      tag.textContent = addressed;
      who.appendChild(tag);
    }
    d.appendChild(who);
    // Taking or pulling an offer is an ordinary choice, so the button is
    // whichever one the engine is offering for it.
    const c = v.choices.find(c => c.label === `Accept offer ${o.i}` || c.label === `Withdraw offer ${o.i}`);
    if (c) {
      const b = document.createElement('button');
      b.textContent = o.mine ? 'withdraw' : 'accept';
      b.onclick = () => act(c.i);
      d.appendChild(b);
    }
    if (!o.mine && v.canPropose) {
      const b = document.createElement('button');
      b.textContent = 'counter';
      b.onclick = () => counter(o);
      d.appendChild(b);
    }
    offers.appendChild(d);
  });

  renderCompose();

  const log = document.getElementById('log');
  log.textContent = '';
  v.log.forEach(l => {
    const d = document.createElement('div');
    d.textContent = l.t;
    log.appendChild(d);
  });
  log.scrollTop = log.scrollHeight;
}

// --- the trade composer ---
let give = [0, 0, 0, 0, 0], want = [0, 0, 0, 0, 0], to = '';

// Answer an offer with one of your own: their side becomes yours, mirrored,
// as a starting point to edit. R-7.3 makes the counterparty the only seat this
// can go to, so it is addressed to them.
function counter(o) {
  give = o.want.slice();
  want = o.give.slice();
  to = String(o.from);
  renderCompose();
  document.getElementById('proposePanel').scrollIntoView({ block: 'nearest' });
}

function renderCompose() {
  const panel = document.getElementById('proposePanel');
  panel.style.display = view.canPropose ? '' : 'none';
  if (!view.canPropose) return;

  // Who it can go to. On another seat's turn R-7.3 leaves only them, so the
  // choice is made rather than offered.
  const sel = document.getElementById('to');
  const others = view.seats.map(s => s.seat).filter(s => s !== view.you);
  const allowed = view.yourTurn ? others : [view.toAct];
  if (!view.yourTurn) to = String(view.toAct);
  if (allowed.length === 1 && !view.yourTurn) to = String(allowed[0]);
  sel.textContent = '';
  if (view.yourTurn) {
    const any = document.createElement('option');
    any.value = '';
    any.textContent = 'anyone at the table';
    sel.appendChild(any);
  }
  allowed.forEach(p => {
    const o = document.createElement('option');
    o.value = String(p);
    o.textContent = `seat ${p}`;
    sel.appendChild(o);
  });
  sel.value = to;
  sel.onchange = () => { to = sel.value; };

  panel.querySelector('h2').textContent =
    view.yourTurn ? 'Offer a trade' : `Counter seat ${view.toAct}`;

  [['give', give], ['want', want]].forEach(([which, counts]) => {
    const host = document.getElementById(which);
    host.textContent = '';
    view.resourceNames.forEach(r => {
      // A resource may not sit on both sides of one trade (R-7.18), so
      // claiming it for one side closes it on the other.
      const blocked = which === 'give' ? want[r.i] > 0 : give[r.i] > 0;
      const row = document.createElement('div');
      row.className = 'row ' + (counts[r.i] ? 'on' : 'off');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      const have = document.createElement('span');
      have.className = 'have';
      have.textContent = which === 'give' ? view.yourHand[r.i] : '';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.disabled = counts[r.i] === 0;
      minus.onclick = () => { counts[r.i]--; renderCompose(); };
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = counts[r.i];
      const plus = document.createElement('button');
      plus.textContent = '+';
      // You can only offer what you hold; what you ask for is bounded by the
      // supply, and refused at acceptance if nobody can pay.
      plus.disabled = blocked || (which === 'give' && counts[r.i] >= view.yourHand[r.i]);
      plus.onclick = () => { counts[r.i]++; renderCompose(); };
      row.append(name, have, minus, n, plus);
      host.appendChild(row);
    });
  });

  const sum = a => a.reduce((x, y) => x + y, 0);
  document.getElementById('propose').disabled = !sum(give) || !sum(want);
}

document.getElementById('propose').onclick = async () => {
  await load('/api/propose', {
    method: 'POST',
    body: to === ''
      ? JSON.stringify({ give, want, version: view.version })
      : JSON.stringify({ give, want, to: Number(to), version: view.version }),
  });
};

async function load(url, opts) {
  const r = await fetch(url, opts);
  const next = await r.json();
  // A composed offer is about a position; when that moves, start it over
  // rather than carrying a half-built offer into a hand that has changed.
  if (!view || next.version !== view.version) {
    give = [0, 0, 0, 0, 0]; want = [0, 0, 0, 0, 0]; to = '';
  }
  view = next;
  render();
}
function act(i) {
  load('/api/act', {
    method: 'POST',
    body: JSON.stringify({ action: i, version: view.version }),
  });
}
document.getElementById('labels').onchange = () => { if (view) { draw(); } };
document.getElementById('new').onclick = () => {
  const seats = document.getElementById('seats').value;
  const mode = document.getElementById('mode').value;
  load(`/api/new?seats=${seats}&mode=${mode}`, { method: 'POST' });
};
loadArt().then(() => load('/api/state'));

// The server is restarted whenever a change is pulled, and a page served by
// the old one cannot re-render its way up to date. Watch the build stamp and
// start over when it moves, so a pushed change reaches the board without
// anyone reloading anything.
setInterval(async () => {
  try {
    const next = await (await fetch('/api/state', { cache: 'no-store' })).json();
    if (view && next.build !== view.build) { location.reload(); }
  } catch (e) {
    // The server is mid-restart. Nothing to do but ask again shortly.
  }
}, 3000);
</script>
</body>
</html>
