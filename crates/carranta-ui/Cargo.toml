[package]
name = "carranta-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Play Carranta locally in a browser: a dependency-free HTTP server over the engine."

[[bin]]
name = "carranta-play"
path = "src/main.rs"

[dependencies]
carranta-core = { path = "../carranta-core" }
carranta-bot = { path = "../carranta-bot" }
carranta-record = { path = "../carranta-record" }
carranta-analytics = { path = "../carranta-analytics" }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
getrandom = "0.4.3"

[lints.rust]
unsafe_code = "forbid"
